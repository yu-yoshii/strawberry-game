<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>いちご王国オンライン</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #fff0f5; color: #333; margin-top: 20px; position: relative; overflow-x: hidden; }
        .card { width: 55px; height: 80px; background: white; border: 2px solid #ff69b4; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; font-size: 22px; font-weight: bold; cursor: pointer; margin: 5px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: transform 0.1s; }
        .card:hover { background: #ffe4e1; transform: translateY(-3px); }
        .calc-btn { width: 50px; height: 50px; font-size: 20px; margin: 4px; background: #ff69b4; color: white; border: none; border-radius: 8px; cursor: pointer; }
        .calc-btn:hover { background: #db0073; }
        input, button.main-btn { padding: 10px; font-size: 16px; border-radius: 5px; margin: 5px; }
        button.main-btn { background: #ff1493; color: white; border: none; cursor: pointer; }
        button.main-btn:hover { background: #db0073; }
        .screen { display: none; }
        .screen.active { display: block; }
        #message { font-size: 20px; color: #d81b60; font-weight: bold; margin: 15px; padding: 10px; background: #ffe4e1; border-radius: 8px; display: inline-block; }
        .version-tag { position: fixed; bottom: 10px; right: 15px; font-size: 14px; color: #888; background: rgba(255,255,255,0.8); padding: 4px 8px; border-radius: 4px; }
        #timer-box { font-size: 18px; color: #c71585; font-weight: bold; margin-top: 5px; }
        #pass-status { font-size: 16px; color: #ff8c00; font-weight: bold; margin: 5px; }
        #live-preview { font-size: 15px; color: #555; margin-top: 5px; min-height: 22px; font-weight: bold; }

        .lobby-container { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; margin-top: 15px; }
        .lobby-box { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 320px; text-align: left; }
        .lobby-box h3 { margin-top: 0; color: #d81b60; border-bottom: 2px solid #ffe4e1; padding-bottom: 5px; }
        .ranking-list, .waiting-list { max-height: 180px; overflow-y: auto; font-size: 15px; }

        @keyframes celebration {
            0% { transform: scale(0.5) rotate(-5deg); opacity: 0; }
            50% { transform: scale(1.1) rotate(3deg); opacity: 1; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }
        .victory-banner {
            display: none;
            position: fixed;
            top: 30%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(135deg, #ff1493, #ff69b4, #ffc0cb);
            color: white;
            padding: 30px 50px;
            font-size: 36px;
            font-weight: bold;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(255, 20, 147, 0.5);
            z-index: 999;
            animation: celebration 0.6s ease-out forwards;
            border: 4px solid white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <div id="victory-banner" class="victory-banner">🍓 👑 BATTLE FINISHED! 👑 🍓<br><span id="victory-text" style="font-size: 22px;"></span></div>

    <!-- 1. ログイン画面 -->
    <div id="screen-auth" class="screen active">
        <h1>🍓 いちご王国オンライン 🍓</h1>
        <div style="background: white; display: inline-block; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
            <h3>ログイン または 新規登録</h3>
            <input type="text" id="username" placeholder="ユーザー名"><br>
            <input type="password" id="password" placeholder="パスワード"><br><br>
            <button class="main-btn" onclick="auth('login')">ログイン</button>
            <button class="main-btn" onclick="auth('register')">新規登録</button>
            <p id="auth-msg" style="color: red;"></p>
        </div>
    </div>

    <!-- 2. ロビー画面 -->
    <div id="screen-lobby" class="screen">
        <h1>🍓 ロビー 🍓</h1>
        <div style="background: white; display: inline-block; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 850px;">
            <h3 id="welcome-msg" style="margin-bottom: 5px;"></h3>
            <p style="color: #666; font-size: 14px;">ルール：場のカードをすべて使って「15」を早く作れ！</p>
            <div>
                <button class="main-btn" onclick="startMatching()" style="font-size: 18px; padding: 12px 25px; background: #ff1493;">マルチ対戦開始（2〜4人）</button>
                <button class="main-btn" onclick="startSolo()" style="font-size: 18px; padding: 12px 25px; background: #28a745;">ソロ練習モード</button>
            </div>
            
            <div class="lobby-container">
                <div class="lobby-box">
                    <h3>👑 王国ランキング</h3>
                    <div id="ranking-list" class="ranking-list">読み込み中...</div>
                </div>
                <div class="lobby-box">
                    <h3>🔍 マッチング募集中</h3>
                    <div id="waiting-list" class="waiting-list">誰もいません</div>
                </div>
            </div>

            <br>
            <button onclick="logout()" style="background: none; border: none; color: #888; cursor: pointer; text-decoration: underline;">ログアウト</button>
        </div>
    </div>

    <!-- 3. マッチング待機画面 -->
    <div id="screen-waiting" class="screen">
        <h1>マッチメイキング</h1>
        <p id="waiting-text" style="font-size: 18px; color: #555;">対戦相手を探しています...</p>
        <button class="main-btn" onclick="cancelMatching()" style="background: #777;">キャンセル</button>
    </div>

    <!-- 4. ゲーム画面 -->
    <div id="screen-game" class="screen">
        <h2 id="room-info">ラウンド 1</h2>
        <div id="message">読み込み中...</div>
        <div id="timer-box"></div>
        <div id="pass-status"></div>
        
        <h3>場のカード（クリックすると式に入力されます）</h3>
        <div id="field-cards"></div>

        <div>
            <input type="text" id="expression" style="width: 350px; text-align: center; font-size: 22px;" placeholder="例: (1+2)*(3+4)-5" oninput="updateLivePreview()"><br>
            <div id="live-preview">計算結果: -</div>
            <div>
                <button class="calc-btn" onclick="appendExpr('+')">+</button>
                <button class="calc-btn" onclick="appendExpr('-')">-</button>
                <button class="calc-btn" onclick="appendExpr('*')">×</button>
                <button class="calc-btn" onclick="appendExpr('/')">÷</button>
                <button class="calc-btn" onclick="appendExpr('(')">(</button>
                <button class="calc-btn" onclick="appendExpr(')')">)</button>
                <button class="calc-btn" onclick="backspaceExpr()" style="background:#888;" title="1文字消す">←</button>
                <button class="calc-btn" onclick="clearExpr()" style="background:#555;">クリア</button>
            </div>
            <br>
            <button id="submit-btn" class="main-btn" onclick="sendCalc()" style="font-size: 18px; padding: 12px 40px; background: #28a745;">「15」で解答送信！</button>
            <button id="pass-btn" class="main-btn" onclick="togglePass()" style="font-size: 16px; padding: 12px 20px; background: #ff8c00;">カードを更新 (パス)</button>
            <br><br>
            <button id="back-lobby-btn" class="main-btn" onclick="returnToLobby()" style="background: #666; display: none;">ロビーに戻る</button>
        </div>

        <h3>対戦状況</h3>
        <div id="status" style="font-size: 16px;"></div>
    </div>

    <div id="version-display" class="version-tag">v1.8.0</div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let currentUser = null;
        let currentGameRoom = null;
        let currentFieldCards = [];
        let reviewTimer = null;
        let isPassRequested = false;

        window.addEventListener('DOMContentLoaded', () => {
            const savedUserId = localStorage.getItem('strawberry_user_id');
            if (savedUserId) {
                socket.emit('restoreSession', parseInt(savedUserId), (res) => {
                    if (res && res.success) {
                        currentUser = res.user;
                        updateWelcomeMsg();
                        showScreen('screen-lobby');
                        socket.emit('requestLobbyData');
                        if (res.reconnectRoom) {
                            socket.emit('updateState', res.reconnectRoom);
                        }
                    } else {
                        localStorage.removeItem('strawberry_user_id');
                    }
                });
            }
        });

        socket.on('connect', () => {
            const savedUserId = localStorage.getItem('strawberry_user_id');
            if (savedUserId && !currentUser) {
                socket.emit('restoreSession', parseInt(savedUserId), (res) => {
                    if (res && res.success) {
                        currentUser = res.user;
                        updateWelcomeMsg();
                        socket.emit('requestLobbyData');
                    }
                });
            }
        });

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        async function auth(type) {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const res = await fetch(`/api/${type}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();
            if (data.success) {
                currentUser = data.user;
                localStorage.setItem('strawberry_user_id', currentUser.id);
                updateWelcomeMsg();
                showScreen('screen-lobby');
                socket.emit('requestLobbyData');
            } else {
                document.getElementById('auth-msg').innerText = data.message;
            }
        }

        function logout() {
            localStorage.removeItem('strawberry_user_id');
            currentUser = null;
            showScreen('screen-auth');
        }

        function updateWelcomeMsg() {
            if (!currentUser) return;
            document.getElementById('welcome-msg').innerHTML = `ようこそ、${currentUser.username} さん！ <span style="color:#d81b60; font-weight:bold;">(レート: ${currentUser.rating})</span>`;
        }

        function startMatching() {
            if (!currentUser) return;
            isPassRequested = false;
            showScreen('screen-waiting');
            socket.emit('startMatchmaking', currentUser.id);
        }

        function startSolo() {
            if (!currentUser) return;
            isPassRequested = false;
            socket.emit('startSoloMode', currentUser.id);
        }

        function cancelMatching() {
            socket.emit('cancelMatchmaking');
            showScreen('screen-lobby');
            socket.emit('requestLobbyData');
        }

        function returnToLobby() {
            document.getElementById('victory-banner').style.display = 'none';
            showScreen('screen-lobby');
            socket.emit('requestLobbyData');
        }

        socket.on('lobbyData', (data) => {
            let rankHtml = '<table width="100%">';
            data.ranking.forEach((u, index) => {
                const crown = index === 0 ? '👑 ' : index === 1 ? '🥈 ' : index === 2 ? '🥉 ' : `${index + 1}. `;
                rankHtml += `<tr><td>${crown}${u.username}</td><td align="right" style="color:#d81b60; font-weight:bold;">${u.rating}</td></tr>`;
            });
            rankHtml += '</table>';
            document.getElementById('ranking-list').innerHTML = rankHtml;

            if (data.waitingPlayers.length === 0) {
                document.getElementById('waiting-list').innerHTML = '<span style="color:#888;">誰もいません</span>';
            } else {
                let waitHtml = '<ul style="padding-left: 20px; margin: 0;">';
                data.waitingPlayers.forEach(name => {
                    waitHtml += `<li>${name} さん</li>`;
                });
                waitHtml += '</ul>';
                document.getElementById('waiting-list').innerHTML = waitHtml;
            }
        });

        function togglePass() {
            isPassRequested = !isPassRequested;
            socket.emit('requestPass', { roomId: currentGameRoom, pass: isPassRequested });
        }

        socket.on('waiting', (msg) => {
            document.getElementById('waiting-text').innerText = msg;
        });

        socket.on('notify', (msg) => {
            alert(msg);
        });

        socket.on('updateState', (state) => {
            showScreen('screen-game');
            currentGameRoom = state.roomId;
            currentFieldCards = state.fieldCards;
            document.getElementById('version-display').innerText = state.version;

            document.getElementById('message').innerText = state.message;
            document.getElementById('room-info').innerText = state.isSolo ? '🍓 ソロ練習モード' : `ラウンド ${state.currentRound}`;

            const meInState = state.players.find(p => p.dbId === currentUser?.id);
            if (meInState) {
                currentUser.rating = meInState.rating;
                updateWelcomeMsg();
                localStorage.setItem('strawberry_user_id', currentUser.id);
            }

            const isLocked = state.isReviewing || state.isGameOver;
            document.getElementById('expression').disabled = isLocked;
            document.getElementById('submit-btn').disabled = isLocked;

            if (state.isGameOver && !state.isSolo) {
                document.getElementById('back-lobby-btn').style.display = 'inline-block';
                const sorted = [...state.players].sort((a, b) => b.score - a.score);
                const winner = sorted[0];
                
                if (winner && winner.dbId === currentUser?.id) {
                    document.getElementById('victory-text').innerHTML = `おめでとう！王国を制覇した！<br><b>レート更新！ (現在: ${winner.rating})</b>`;
                    document.getElementById('victory-banner').style.display = 'block';
                } else if (winner) {
                    document.getElementById('victory-text').innerHTML = `試合終了！勝者は ${winner.username} です。<br><b>レート更新 (現在: ${meInState ? meInState.rating : ''})</b>`;
                    document.getElementById('victory-banner').style.display = 'block';
                }
            } else if (state.isSolo) {
                document.getElementById('back-lobby-btn').style.display = 'inline-block';
            } else {
                document.getElementById('back-lobby-btn').style.display = 'none';
                document.getElementById('victory-banner').style.display = 'none';
            }

            if (state.isReviewing) {
                document.getElementById('expression').value = '';
                document.getElementById('live-preview').innerText = '計算結果: -';
            }

            const fieldDiv = document.getElementById('field-cards');
            fieldDiv.innerHTML = '';
            state.fieldCards.forEach(num => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerText = num;
                card.onclick = () => {
                    if (!isLocked) appendExpr(num.toString());
                };
                fieldDiv.appendChild(card);
            });

            let statusHtml = '';
            state.players.forEach(p => {
                const isMe = p.dbId === currentUser?.id;
                statusHtml += `${isMe ? '<b>[あなた]</b> ' : ''}${p.username} ${!state.isSolo ? `(レート: ${p.rating})` : ''}<br>`;
                statusHtml += `獲得正解数: 🏆 ${p.score} ${!state.isSolo ? '/ 3勝' : ''}<br><br>`;
            });
            document.getElementById('status').innerHTML = statusHtml;
            updateLivePreview();
        });

        function updateLivePreview() {
            const expr = document.getElementById('expression').value;
            const preview = document.getElementById('live-preview');
            if (!expr.trim()) {
                preview.innerText = '計算結果: -';
                preview.style.color = '#555';
                return;
            }

            try {
                const sanitized = expr.replace(/×/g, '*').replace(/÷/g, '/');
                if (!/^[0-9\+\-\*\/\(\)\.\s]+$/.test(sanitized)) {
                    preview.innerText = '計算結果: 無効な文字';
                    preview.style.color = 'red';
                    return;
                }

                // 簡易クライアントサイド計算
                const val = Function('"use strict";return (' + sanitized + ')')();
                const usedNums = sanitized.match(/\d+/g)?.map(Number) || [];
                
                let text = `計算結果: ${val}`;
                if (usedNums.length !== currentFieldCards.length) {
                    text += ` (カード数: ${usedNums.length}/${currentFieldCards.length})`;
                } else if (Math.abs(val - 15) < 1e-9) {
                    text += ' 🎯 「15」達成！';
                    preview.style.color = '#28a745';
                    preview.innerText = text;
                    return;
                }
                preview.style.color = '#d81b60';
                preview.innerText = text;
            } catch (e) {
                preview.innerText = '計算結果: 計算中...';
                preview.style.color = '#555';
            }
        }

        function appendExpr(val) {
            const input = document.getElementById('expression');
            const start = input.selectionStart;
            const end = input.selectionEnd;
            const text = input.value;
            input.value = text.substring(0, start) + val + text.substring(end);
            input.focus();
            input.setSelectionRange(start + val.length, start + val.length);
            updateLivePreview();
        }

        function backspaceExpr() {
            const input = document.getElementById('expression');
            const start = input.selectionStart;
            const end = input.selectionEnd;
            const text = input.value;
            if (start !== end) {
                input.value = text.substring(0, start) + text.substring(end);
                input.setSelectionRange(start, start);
            } else if (start > 0) {
                input.value = text.substring(0, start - 1) + text.substring(start);
                input.setSelectionRange(start - 1, start - 1);
            }
            input.focus();
            updateLivePreview();
        }

        function clearExpr() {
            document.getElementById('expression').value = '';
            document.getElementById('expression').focus();
            updateLivePreview();
        }

        function sendCalc() {
            const expression = document.getElementById('expression').value;
            if (!expression.trim()) return;
            socket.emit('tryCalc', { roomId: currentGameRoom, expression });
        }
    </script>
</body>
</html>
